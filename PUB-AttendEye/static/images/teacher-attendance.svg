<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
<title id="title">Teacher taking classroom attendance</title><desc id="desc">A teacher uses a tablet while students sit at desks in a modern university classroom.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183c66"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#3979f6"/></linearGradient><linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce9f5"/><stop offset="1" stop-color="#9bb8d3"/></linearGradient></defs>
<rect x="12" y="12" width="796" height="596" rx="34" fill="url(#bg)" stroke="#6edce5" stroke-opacity=".25" stroke-width="2"/>
<circle cx="675" cy="105" r="76" fill="#2dd4bf" opacity=".09"/><circle cx="140" cy="490" r="110" fill="#3979f6" opacity=".12"/>
<!-- classroom window --> <rect x="80" y="70" width="265" height="175" rx="12" fill="#b8e7f6" opacity=".92"/><path d="M212 70v175M80 157h265" stroke="#5e8cae" stroke-width="8"/><path d="M95 88h235v138H95z" fill="#8ed4f1" opacity=".7"/><path d="M105 213l60-75 45 50 36-42 77 67" fill="#4cae9a" opacity=".65"/>
<!-- board --> <rect x="390" y="76" width="340" height="155" rx="12" fill="#f4f8fc"/><rect x="410" y="96" width="300" height="115" rx="6" fill="#d9f1f2"/><path d="M434 126h172M434 151h230M434 176h140" stroke="#4b9ba6" stroke-width="8" stroke-linecap="round" opacity=".7"/><circle cx="678" cy="125" r="13" fill="#2dd4bf"/>
<!-- teacher body --> <path d="M330 388c10-72 40-112 92-112s83 40 94 112l-10 116H338z" fill="#3979f6"/><path d="M368 292l53 42 54-42-15-26h-78z" fill="#e7f0f8"/><path d="M400 323l21 30 22-30-12-17h-20z" fill="#2dd4bf"/>
<!-- neck and head --> <rect x="402" y="245" width="42" height="44" rx="14" fill="#c98964"/><ellipse cx="423" cy="211" rx="61" ry="70" fill="#d9a17c"/><path d="M363 213c-7-52 13-84 56-86 49-3 73 31 68 76l-12-23-10-31c-25 21-59 30-101 28z" fill="#26374d"/><path d="M375 211q-11 20 4 31M466 211q11 20-4 31" stroke="#c98964" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="402" cy="214" r="4" fill="#26374d"/><circle cx="445" cy="214" r="4" fill="#26374d"/><path d="M408 242q15 12 30 0" stroke="#8b4f42" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- arm and tablet --> <path d="M360 340l-48 72 75 33 29-67z" fill="#d9a17c"/><rect x="285" y="395" width="104" height="68" rx="10" transform="rotate(12 285 395)" fill="#172a40" stroke="#9ddce7" stroke-width="4"/><rect x="300" y="406" width="74" height="45" rx="4" transform="rotate(12 300 406)" fill="url(#screen)"/><path d="M311 420l12 8 18-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- students seated --> <g><circle cx="155" cy="345" r="35" fill="#b97c5b"/><path d="M119 343c-3-34 14-52 38-52 30 0 43 22 35 52l-12-20-43 1z" fill="#27364c"/><path d="M101 450q6-70 54-70t55 70v35H101z" fill="#2dd4bf"/><circle cx="225" cy="365" r="31" fill="#d6a07c"/><path d="M194 363c-2-31 14-48 34-48 26 0 39 20 33 48l-12-18-43 0z" fill="#49352f"/><path d="M179 461q5-61 47-61t47 61v24h-94z" fill="#e4edf6"/></g>
<!-- desks --> <path d="M70 474h260l-20 28H92z" fill="url(#desk)"/><path d="M102 502v66M287 502v66" stroke="#8ba8c3" stroke-width="10"/><path d="M500 470h245l-18 28H520z" fill="url(#desk)"/><path d="M532 498v67M710 498v67" stroke="#8ba8c3" stroke-width="10"/>
<!-- attendance indicator --> <rect x="552" y="290" width="168" height="76" rx="18" fill="#fff" fill-opacity=".97"/><circle cx="584" cy="328" r="18" fill="#d7faf2"/><path d="M575 328l7 7 13-15" stroke="#079b87" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="612" y="323" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#163451">Attendance</text><text x="612" y="343" font-family="Arial,sans-serif" font-size="12" fill="#52708a">Recorded</text>
</svg>